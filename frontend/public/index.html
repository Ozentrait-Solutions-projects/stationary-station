<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <!-- Splash / theme color matches our dark splash background -->
    <meta name="theme-color" content="#12063a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NexCart" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="description" content="NexCart — Shop millions of products at unbeatable prices. Free delivery, easy returns, premium experience." />
    <meta property="og:title" content="NexCart — The Future of Shopping" />
    <meta property="og:description" content="Shop electronics, fashion, home goods and more with NexCart. Fast delivery, secure checkout." />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <title>NexCart — The Future of Shopping</title>
    <style>
      /* Prevent white flash before React mounts — matches splash screen background */
      html, body, #root {
        background-color: #0a0a1a;
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" style="width: 100%; max-width: 100vw; overflow-x: hidden;"></div>
